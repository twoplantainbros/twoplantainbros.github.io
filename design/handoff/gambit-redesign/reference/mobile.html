 16px 0; border-radius: 24px; background: #22130B; color: #F6F0E6; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 80px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -.03em\">Join the waitlist<\/h3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: rgba(246,240,230,.8)\">We\u2019re taking Plantain chips up on the main stage and you\u2019re invited on our journey there! Once we restock you\u2019ll be the first to know. Thanks for your support!<\/p>\n<sc-if value=\"{{notJoined}}\" hint-placeholder-val=\"{{true}}\">\n<form onSubmit=\"{{join}}\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<label for=\"mw-name\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Name<\/label>\n<input id=\"mw-name\" class=\"wl-input\" type=\"text\" required=\"\" autocomplete=\"name\" placeholder=\"Name\" value=\"{{wlName}}\" onInput=\"{{onName}}\">\n<label for=\"mw-phone\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Phone number<\/label>\n<input id=\"mw-phone\" class=\"wl-input\" type=\"tel\" required=\"\" inputmode=\"tel\" autocomplete=\"tel\" placeholder=\"Phone number\" value=\"{{wlPhone}}\" onInput=\"{{onPhone}}\">\n<button type=\"submit\" class=\"tap\" style=\"min-height: 54px; border: 0; border-radius: 999px; background: #F6F0E6; color: #22130B; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer\">Join the waitlist<\/button>\n<\/form>\n<\/sc-if>\n<sc-if value=\"{{joined}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<span aria-hidden=\"true\" style=\"display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: #E3A92B; color: #22130B; font-size: 22px; font-weight: 800\">\u2713<\/span>\n<div style=\"font-size: 22px; font-weight: 800; letter-spacing: -.02em\">You\u2019re on the list{{nameComma}}.<\/div>\n<div style=\"font-size: 15px; line-height: 1.5; color: rgba(246,240,230,.8)\">{{joinedMsg}}<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/sc-if>\n<\/section>\n\n<section style=\"background: #22130B; color: #F6F0E6; padding: 48px 16px 8px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -.03em\">About Gambit<\/h2>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600\">Our chips break out of boundaries.<\/p>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: rgba(246,240,230,.82)\">We understand what makes plantain chips so good, that\u2019s why we\u2019re not afraid to take a gambit with new shapes and flavors. We\u2019ve run tests day after day for months to narrow down on the shapes and flavors we have for Gambits today, and we\u2019ve landed on something special. Try one and you\u2019ll get it too.<\/p>\n<\/section>\n\n<section style=\"background: #22130B; color: #F6F0E6; padding: 32px 16px 48px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3\"><img src=\"../assets/founders.webp\" alt=\"Himanshu and Atharv, Gambit's founders\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block\"><\/div>\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -4px\">\n<span style=\"font-size: 15px; font-weight: 700\">Himanshu &amp; Atharv<\/span>\n<a href=\"https://www.instagram.com/twoplantainbros/\" style=\"display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; color: #E3A92B; text-decoration: underline; text-underline-offset: 3px\">@twoplantainbros<\/a>\n<\/div>\n<h2 style=\"margin: 16px 0 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -.03em\">Our gambit<\/h2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: rgba(246,240,230,.82)\">It all started when Himanshu grabbed a bag of \u201cHot and Spicy\u201d Plantain Chips to get a taste of childhood. But those chips sucked. The chips we grew up with were crunchy, salty and always around for us. We realized we took those chips for granted.<\/p>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: rgba(246,240,230,.82)\">As we scoured the aisles and saw rows and rows of fancy new flavors and shapes on potato chip we realized that plantain chips had been left behind and we set out to change that.<\/p>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: rgba(246,240,230,.82)\">Our first chips sucked. But each batch was better than the last and we didn\u2019t stop when we reached \u201cgood\u201d. We strove to break boundaries with these chips in the pursuit of something \u201cgreat\u201d and we landed at waffle-cut with crazy good flavors like Churro and BBQ.<\/p>\n<\/section>\n\n<section style=\"background: #F3E2AE; padding: 56px 16px; display: flex; flex-direction: column; gap: 24px; align-items: center; text-align: center\">\n<div aria-hidden=\"true\" style=\"display: flex\">\n<sc-for list=\"{{flavors}}\" as=\"item\" hint-placeholder-count=\"3\">\n<img class=\"idle\" src=\"{{item.disc}}\" alt=\"\" style=\"width: 128px; height: 128px; margin: 0 -12px; animation-duration: {{item.endSpin}}; filter: drop-shadow(0 12px 14px rgba(34,19,11,.28))\">\n<\/sc-for>\n<\/div>\n<h2 style=\"margin: 0; font-size: 42px; line-height: .95; font-weight: 800; letter-spacing: -.035em\">Try one and you\u2019ll get it too.<\/h2>\n<sc-if value=\"{{inStock}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" class=\"tap\" onClick=\"{{openSheet}}\" style=\"min-height: 54px; padding: 0 32px; border: 0; border-radius: 999px; background: #22130B; color: #F6F0E6; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer\">Build your box<\/button><\/sc-if>\n<sc-if value=\"{{soldOut}}\" hint-placeholder-val=\"{{true}}\"><a href=\"#m-waitlist\" class=\"tap\" style=\"display: inline-flex; align-items: center; min-height: 54px; padding: 0 32px; border-radius: 999px; background: #22130B; color: #F6F0E6; text-decoration: none; font-size: 16px; font-weight: 700\">Join the waitlist<\/a><\/sc-if>\n<\/section>\n\n<section style=\"padding: 32px 16px 40px; border-top: 1px solid rgba(34,19,11,.08)\">\n<h2 style=\"margin: 0 0 8px; font-size: 34px; line-height: .98; font-weight: 800; letter-spacing: -.03em\">FAQ<\/h2>\n<sc-for list=\"{{faqs}}\" as=\"q\" hint-placeholder-count=\"3\">\n<div style=\"border-bottom: 1px solid rgba(34,19,11,.18)\">\n<h3 style=\"margin: 0\"><button type=\"button\" aria-expanded=\"{{q.expanded}}\" onClick=\"{{q.toggle}}\" style=\"width: 100%; min-height: 60px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; border: 0; padding: 14px 0; font: inherit; font-size: 17px; font-weight: 700; color: #22130B; text-align: left; cursor: pointer\"><span>{{q.q}}<\/span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 12h14\"><\/path><path d=\"M12 5v14\" style=\"opacity: {{q.vOp}}; transition: opacity .2s ease\"><\/path><\/svg><\/button><\/h3>\n<sc-if value=\"{{q.open}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #4A3428\">{{q.a}}<\/p><\/sc-if>\n<\/div>\n<\/sc-for>\n<p style=\"margin: 20px 0 0; font-size: 15px; color: #6B5446\">Still curious? <a href=\"mailto:twoplantainbros@gmail.com\" style=\"color: #22130B; font-weight: 600\">twoplantainbros@gmail.com<\/a><\/p>\n<\/section>\n\n<footer class=\"safe-sheet\" style=\"background: #22130B; color: #F6F0E6; padding-top: 36px; padding-right: 16px; padding-left: 16px; display: flex; flex-direction: column; gap: 14px\">\n<img src=\"../assets/logo-
