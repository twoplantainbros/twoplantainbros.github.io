m\" hint-placeholder-count=\"3\">\n<img src=\"{{item.disc}}\" alt=\"{{item.alt}}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; opacity: {{item.stageOpacity}}; transition: opacity .8s ease\">\n<\/sc-for>\n<\/div>\n<sc-for list=\"{{flavors}}\" as=\"item\" hint-placeholder-count=\"3\">\n<img src=\"{{item.bag}}\" alt=\"\" style=\"position: absolute; left: -8%; bottom: -4%; width: 23%; height: auto; z-index: 2; opacity: {{item.stageOpacity}}; transform: translateY({{item.stageBagY}}) rotate(-5deg); transition: opacity .6s ease, transform .9s cubic-bezier(.2,.9,.25,1.15); filter: drop-shadow(0 18px 18px rgba(20,8,4,.4))\">\n<\/sc-for>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- Real bags, real bowls: a slow drift -->\n<section aria-label=\"Gambit bags and bowls\" style=\"padding: clamp(64px, 7vw, 104px) 0; overflow: hidden\">\n<div class=\"drift\">\n<sc-for list=\"{{scenes}}\" as=\"s\" hint-placeholder-count=\"6\">\n<img src=\"{{s.src}}\" alt=\"{{s.alt}}\" style=\"height: clamp(280px, 30vw, 440px); width: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 22px; margin-right: 18px; display: block\">\n<\/sc-for>\n<\/div>\n<\/section>\n\n<!-- Build your box: the bags lead -->\n<section id=\"box\" style=\"background: #F6F0E6; border-top: 1px solid rgba(34,19,11,.08)\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(80px, 9vw, 120px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center\">\n<sc-if value=\"{{inStock}}\" hint-placeholder-val=\"{{false}}\">\n<h2 style=\"margin: 0; font-size: clamp(44px, 5vw, 72px); line-height: .95; font-weight: 800; letter-spacing: -.035em\">Build your box<\/h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.55; color: #4A3428; max-width: 46ch\">Mix any flavors in a case of 6 for $6 a bag, or grab single bags for $11.25. Shipping is free on every order.<\/p>\n<\/sc-if>\n<sc-if value=\"{{soldOut}}\" hint-placeholder-val=\"{{true}}\">\n<h2 style=\"margin: 0; font-size: clamp(44px, 5vw, 72px); line-height: .95; font-weight: 800; letter-spacing: -.035em\">Sold out, for now.<\/h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.55; color: #4A3428; max-width: 48ch\">Every flavor sold out. Join the waitlist and you\u2019ll be the first to know when we restock.<\/p>\n<\/sc-if>\n<\/div>\n\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px\">\n<sc-for list=\"{{flavors}}\" as=\"item\" hint-placeholder-count=\"3\">\n<article style=\"background: {{item.tint}}; border-radius: 28px; padding: 36px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px\">\n<div style=\"position: relative; height: 320px; width: 100%; display: grid; place-items: end center\">\n<div style=\"position: absolute; left: 50%; bottom: -6px; width: 210px; height: 30px; margin-left: -105px; border-radius: 50%; background: rgba(34,19,11,.35); filter: blur(12px)\"><\/div>\n<img class=\"bag-wiggle\" src=\"{{item.bag}}\" alt=\"Gambit {{item.name}} bag\" style=\"position: relative; height: 300px; width: auto; display: block; transform: translateY({{item.bagLift}}) rotate({{item.bagTilt}})\">\n<sc-if value=\"{{soldOut}}\" hint-placeholder-val=\"{{true}}\"><span class=\"sticker\" style=\"top: 8px; left: calc(50% + 46px)\">Sold out<\/span><\/sc-if>\n<\/div>\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em\">{{item.name}}<\/h3>\n<div style=\"font-size: 15px; color: rgba(34,19,11,.7)\">{{item.note}} \u00b7 3 servings<\/div>\n<\/div>\n<div style=\"font-size: 14px; color: rgba(34,19,11,.75)\"><strong style=\"color: #22130B; font-size: 16px\">$6<\/strong> a bag in a case \u00b7 $11.25 single<\/div>\n<div style=\"width: 100%\">\n<sc-if value=\"{{item.showAdd}}\" hint-plac on: column\">\n<sc-for list=\"{{lines}}\" as=\"ln\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(34,19,11,.08)\">\n<img src=\"{{ln.bag}}\" alt=\"\" style=\"width: 28px; height: auto; display: block\">\n<span style=\"flex-grow: 1; font-size: 15px\">{{ln.count}} \u00d7 {{ln.name}}<\/span>\n<span style=\"font-size: 15px; font-weight: 600\">{{ln.amt}}<\/span>\n<\/div>\n<\/sc-for>\n<sc-if value=\"{{noLines}}\" hint-placeholder-val=\"{{false}}\"><div style=\"padding: 10px 0; font-size: 15px; color: rgba(34,19,11,.55); border-bottom: 1px solid rgba(34,19,11,.08)\">Your box is empty.<\/div><\/sc-if>\n<div style=\"display: flex; justify-content: space-between; padding: 10px 0; font-size: 15px; border-bottom: 1px solid rgba(34,19,11,.08)\"><span>Shipping<\/span><span style=\"font-weight: 600\">{{shipLabel}}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">Total<\/span><span style=\"display: flex; align-items: baseline; gap: 10px\"><sc-if value=\"{{isCase}}\" hint-placeholder-val=\"{{false}}\"><s style=\"font-size: 15px; color: rgba(34,19,11,.45)\">{{soloStr}}<\/s><\/sc-if><span style=\"font-size: 32px; font-weight: 800; letter-spacing: -.02em\">{{priceStr}}<\/span><\/span><\/div>\n<\/div>\n<button type=\"button\" class=\"btn\" disabled=\"{{ctaDisabled}}\" style=\"min-height: 58px; border: {{ctaBorder}}; border-radius: 999px; background: {{ctaBg}}; color: {{ctaInk}}; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\/path><\/svg>{{ctaLabel}}<\/button>\n<ul style=\"list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 13px; color: rgba(34,19,11,.7)\">\n<li style=\"display: flex; gap: 8px; align-items: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\/path><\/svg>Secure checkout<\/li>\n<li style=\"display: flex; gap: 8px; align-items: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7h11v9H3zM14 10h4l3 3v3h-7\"><\/path><circle cx=\"7\" cy=\"18\" r=\"1.6\"><\/circle><circle cx=\"17\" cy=\"18\" r=\"1.6\"><\/circle><\/svg>Free shipping on every order<\/li>\n<li style=\"display: flex; gap: 8px; align-items: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\/rect><path d=\"M3 7l9 6 9-6\"><\/path><\/svg>Confirmation email after checkout<\/li>\n<li style=\"display: flex; gap: 8px; align-items: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\/circle><\/svg>Ships to the continental U.S.<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{soldOut}}\" hint-placeholder-val=\"{{true}}\">\n<div id=\"waitlist\" style=\"border-radius: 28px; background: #22130B; color: #F6F0E6; padding: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 32px 56px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 style=\"margin: 0; font-size: clamp(32px, 3.2vw, 44px); line-height: 1; font-weight: 800; letter-spacing: -.03em\">Join the waitlist<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; color: rgba(246,240,230,.8); max-width: 38ch\">We\u2019re taking Plantain chips up on the main stage and you\u2019re invited on our journey there! Once we restock you\u2019ll be the first to know. Thanks for your support!<\/p>\n<\/div>\n<div>\n<sc-if value=\"{{notJoined}}\" hint-placeholder-val=\"{{true}}\">\n<form onSubmit=\"{{join}}\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<label for=\"wl-name\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Name<\/label>\n<input id=\"wl-name\" class=\"wl-input\" type=\"text\" required=\"\" autocomplete=\"name\" placeholder=\"Name\" value=\"{{wlName}}\" onInput=\"{{onName}}\">\n<label for=\"wl-phone\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Phone number<\/label>\n<input id=\"wl-phone\" class=\"wl-input\" type=\"tel\" required=\"\" inputmode=\"tel\" autocomplete=\"tel\" placeholder=\"Phone number\" value=\"{{wlPhone}}\" onInput=\"{{onPhone}}\">\n<button type=\"submit\" class=\"btn\" style=\"min-height: 56px; border: 0; border-radius: 999px; background: #F6F0E6; color: #22130B; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">Join the waitlist<\/button>\n<\/form>\n<\/sc-if>\n<sc-if value=\"{{joined}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 14px\">\n<span aria-hidden=\"true\" style=\"display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: #E3A92B; color: #22130B; font-size: 26px; font-weight: 800\">\u2713<\/span>\n<div style=\"font-size: 26px; font-weight: 800; letter-spacing: -.02em\">You\u2019re on the list{{nameComma}}.<\/div>\n<div style=\"font-size: 16px; line-height: 1.55; color: rgba(246,240,230,.8)\">{{joinedMsg}}<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/section>\n\n<!-- About Gambit + Our gambit -->\n<section id=\"about\" style=\"background: #22130B; color: #F6F0E6\">\n<div id=\"story\" style=\"max-width: 1320px; margin: 0 auto; padding: clamp(72px, 9vw, 120px) clamp(16px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: clamp(40px, 6vw, 88px); align-items: start\">\n<div style=\"position: sticky; top: 104px\">\n<figure style=\"margin: 0; border-radius: 24px; overflow: hidden; aspect-ratio: 1 / 1\"><img src=\"../assets/founders.webp\" alt=\"Himanshu and Atharv, Gambit's founders\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block\"><\/figure>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 14px 4px 0; font-size: 15px\"><span style=\"font-weight: 700\">Himanshu &amp; Atharv<\/span><a href=\"https://www.instagram.com/twoplantainbros/\" class=\"link\" style=\"color: #E3A92B\">@twoplantainbros<\/a><\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 58ch\">\n<h2 style=\"margin: 0; font-size: clamp(36px, 3.8vw, 52px); line-height: 1; font-weight: 800; letter-spacing: -.03em\">About Gambit<\/h2>\n<p style=\"margin: 0; font-size: clamp(22px, 2vw, 27px); line-height: 1.35; font-weight: 600; letter-spacing: -.015em\">Our chips break out of boundaries.<\/p>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: rgba(246,240,230,.82)\">We understand what makes plantain chips so good, that\u2019s why we\u2019re not afraid to take a gambit with new shapes and flavors. We\u2019ve run tests day after day for months to narrow down on the shapes and flavors we have for Gambits today, and we\u2019ve landed on something special. Try one and you\u2019ll get it too.<\/p>\n<h2 style=\"margin: 36px 0 0; font-size: clamp(36px, 3.8vw, 52px); line-height: 1; font-weight: 800; letter-spacing: -.03em\">Our gambit<\/h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: rgba(246,240,230,.82)\">It all started when Himanshu grabbed a bag of \u201cHot and Spicy\u201d Plantain Chips to get a taste of childhood. But those chips sucked. The chips we grew up with were crunchy, salty and always around for us. We realized we took those chips for granted.<\/p>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: rgba(246,240,230,.82)\">As we scoured the aisles and saw rows and rows of fancy new flavors and shapes on potato chip we realized that plantain chips had been left behind and we set out to change that.<\/p>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: rgba(246,240,230,.82)\">Our first chips sucked. But each batch was better than the last and we didn\u2019t stop when we reached \u201cgood\u201d. We strove to break boundaries with these chips in the pursuit of something \u201cgreat\u201d and we landed at waffle-cut with crazy good flavors like Churro and BBQ.<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- Your gambit -->\n<section ref=\"{{setEnd}}\" style=\"background: #F3E2AE; overflow: hidden\">\n<div style=\"max-width: 1320px; margin: 0 auto; padding: clamp(88px, 10vw, 140px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; align-items: center; gap: 36px; text-align: center\">\n<div aria-hidden=\"true\" style=\"display: flex; justify-content: center; opacity: {{endOp}}\">\n<sc-for list=\"{{flavors}}\" as=\"item\" hint-placeholder-count=\"3\">\n<div class=\"{{endClass}}\" style=\"--fromx: {{item.fromx}}; --fromr: {{item.fromr}}; animation-delay: {{item.endDelay}}; margin: 0 -18px\"><img class=\"idle\" src=\"{{item.disc}}\" alt=\"\" style=\"width: clamp(160px, 18vw, 250px); height: auto; display: block; animation-duration: {{item.endSpin}}; filter: drop-shadow(0 26px 24px rgba(34,19,11,.32))\"><\/div>\n<\/sc-for>\n<\/div>\n<h2 style=\"margin: 0; font-size: clamp(44px, 6vw, 88px); line-height: .95; font-weight: 800; letter-spacing: -.035em; max-width: 14ch\">Try one and you\u2019ll get it too.<\/h2>\n<a href=\"#box\" class=\"btn\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 32px; border-radius: 999px; background: #22130B; color: #F6F0E6; text-decoration: none; font-weight: 700; font-size: 17px\">{{closingCta}}<\/a>\n<\/div>\n<\/section>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"border-top: 1px solid rgba(34,19,11,.08)\">\n<div style=\"max-width: 820px; margin: 0 auto; padding: clamp(72px, 9vw, 120px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px\">\n<h2 style=\"margin: 0; font-size: clamp(36px, 3.8vw, 52px); line-height: 1; font-weight: 800; letter-spacing: -.03em; text-align: center\">FAQ<\/h2>\n<div>\n<sc-for list=\"{{faqs}}\" as=\"q\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom: 1px solid rgba(34,19,11,.16)\">\n<h3 style=\"margin: 0\">\n<button type=\"button\" aria-expanded=\"{{q.expanded}}\" onClick=\"{{q.toggle}}\" style=\"width: 100%; min-height: 68px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: none; border: 0; padding: 18px 0; font: inherit; font-size: 19px; font-weight: 700; color: #22130B; text-align: left; cursor: pointer\">\n<span>{{q.q}}<\/span>\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 12h14\"><\/path><path d=\"M12 5v14\" style=\"opacity: {{q.vOp}}; transition: opacity .2s ease\"><\/path><\/svg>\n<\/button>\n<\/h3>\n<sc-if value=\"{{q.open}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0 0 22px; font-size: 17px; line-height: 1.65; color: #4A3428; max-width: 60ch\">{{q.a}}<\/p><\/sc-if>\n<\/div>\n<\/sc-for>\n<\/div>\n<p style=\"margin: 0; text-align: center; font-size: 16px; color: #6B5446\">Still curious? <a href=\"mailto:twoplantainbros@gmail.com\" class=\"link\" style=\"color: #22130B; font-weight: 600\">twoplantainbros@gmail.com<\/a><\/p>\n<\/div>\n<\/section>\n\n<!-- Ticker, again -->\n<div aria-hidden=\"true\" style=\"background: #A42D1E; color: #FFF3EA; overflow: hidden; padding: 22px 0; border-bottom: 1px solid rgba(255,243,234,.12)\">\n<div class=\"ticker\" style=\"animation-direction: reverse\">\n<sc-for list=\"{{tick}}\" as=\"t\" hint-placeholder-count=\"8\">\n<span style=\"display: inline-flex; align-items: center; gap: 36px; padding-right: 36px; font-size: 30px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; font-stretch: 112%\">{{t}}<svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#E3A92B\" stroke-width=\"3\"><path d=\"M2 6h18M2 16h18M6 2v18M16 2v18\"><\/path><\/g><\/svg><\/span>\n<\/sc-for>\n<\/div>\n<\/div>\n\n<footer style=\"background: #22130B; color: #F6F0E6\">\n<div style=\"max-width: 1320px; margin: 0 auto; padding: clamp(56px, 7vw, 88px) clamp(16px, 4vw, 48px) 28px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 32px\">\n<div><img src=\"../assets/logo-light.png\" alt=\"Gambit\" style=\"height: 34px; width: auto\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(246,240,230,.55)\">Shop<\/div>\n<a href=\"#flavors\" class=\"link\" style=\"align-self: flex-start\">Flavors<\/a>\n<a href=\"#box\" class=\"link\" style=\"align-self: flex-start\">Build your box<\/a>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(246,240,230,.55)\">Gambit<\/div>\n<a href=\"#about\" class=\"link\" style=\"align-self: flex-start\">About Gambit<\/a>\n<a href=\"#story\" class=\"link\" style=\"align-self: flex-start\">Our gambit<\/a>\n<a href=\"#faq\" class=\"link\" style=\"align-self: flex-start\">FAQ<\/a>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(246,240,230,.55)\">Say hi<\/div>\n<a href=\"https://www.instagram.com/twoplantainbros/\" class=\"link\" style=\"align-self: flex-start\">@twoplantainbros<\/a>\n<\/div>\n<\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; color: rgba(246,240,230,.5); border-top: 1px solid rgba(246,240,230,.12); padding-top: 20px\">\n<span>\u00a9 Gambit \u00b7 Waffle cut plantain chips<\/span>\n<span>Ships to the continental U.S.<\/span>\n<\/div>\n<\/div>\n<\/footer>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"inventory\":{\"editor\":\"enum\",\"options\":[\"In stock\",\"Sold out\"],\"default\":\"Sold out\"},\"$preview\":{\"width\":1440,\"height\":7795}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { flavor: 'salt', counts: { salt: 0, bbq: 0, churro: 0 }, faq: 0, email: '', wlName: '', wlPhone: '', joined: false, wants: { salt: false, bbq: false, churro: false } };\n    this.order = ['salt', 'bbq', 'churro'];\n    this.spinDeg = 0;\n    const self = this;\n    this.setScrolly = function (el) { self.scrolly = el; };\n    this.setEnd = function (el) { self.endEl = el; };\n    this.setSpin = function (el) { self.spinEl = el; if (el) el.style.transform = 'rotate(' + self.spinDeg + 'deg)'; };\n    this.onScroll = function () {\n      if (self.ticking) return; self.ticking = true;\n      requestAnimationFrame(function () { self.ticking = false; self.updateScroll(); });\n    };\n  }\n  componentDidMount() {\n    document.addEventListener('scroll', this.onScroll, { capture: true, passive: true });\n    window.addEventListener('resize', this.onScroll);\n    this.updateScroll();\n  }\n  componentWillUnmount() {\n    document.removeEventListener('scroll', this.onScroll, { capture: true });\n    window.removeEventListener('resize', this.onScroll);\n  }\n  updateScroll() {\n    const vh = window.innerHeight;\n    if (this.endEl && !this.state.endIn && this.endEl.getBoundingClientRect().top < vh * 0.8) this.setState({ endIn: true });\n    const el = this.scrolly; if (!el) return;\n    const r = el.getBoundingClientRect();\n    // The bowl turns as you scroll through the section: about a turn and a half end to end.\n    const p = Math.max(0, Math.min(1, (vh - r.top) / (r.height + vh)));\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.spinDeg = reduce ? 0 : p * 540;\n    if (this.spinEl) this.spinEl.style.transform = 'rotate(' + this.spinDeg.toFixed(2) + 'deg)';\n    const ch = el.querySelectorAll('[data-chapter]'); if (!ch.length) return;\n    const vc = vh * 0.5; let best = 0, bd = 1e9;\n    Array.prototype.forEach.call(ch, function (n, i) { const b = n.getBoundingClientRect(); const d = Math.abs(b.top + b.height / 2 - vc); if (d < bd) { bd = d; best = i; } });\n    const k = this.order[best];\n    if (k !== this.state.flavor) this.setState({ flavor: k });\n  }\n  jump(i) {\n    const el = this.scrolly; if (!el) return;\n    const ch = el.querySelectorAll('[data-chapter]');\n    if (ch[i] && ch[i].scrollIntoView) ch[i].scrollIntoView({ behavior: 'smooth', block: 'center' });\n  }\n  data() {\n    if (this._d) return this._d;\n    const B = '/_blob/';\n    this._d = {\n      salt: { id: 'salt', num: '01', name: 'Salt', tag: 'Classic', note: 'Sea salt',\n        short: 'Golden, with sea salt.',\n        desc: 'Golden waffle cut plantain chips with sea salt. Clean and simple, these are the gold standard for Gambit chips.',\n        bag: '../assets/bag-salt.webp', tint: '#F6EBC8', disc: '../assets/bowl-salt.webp', scene: '../assets/scene-salt.webp', alt: 'A bowl of Gambit Salt waffle cut chips',\n        theme: { bg: '#F3E2AE', ink: '#22130B', sub: 'rgba(34,19,11,.78)', accent: '#94650A', btnBg: '#22130B', btnInk: '#F6F0E6', pill: 'rgba(34,19,11,.1)' } },\n      bbq: { id: 'bbq', num: '02', name: 'BBQ', tag: 'Savory', note: 'Smoky sweet',\n        short: 'Smoky sweet, made in house.',\n        desc: 'The same waffle chip texture we love, with a smoky sweet BBQ rub we formulated in house. Try one and you\u2019ll come back for seconds.',\n        bag: '../assets/bag-bbq.webp', tint: '#F1D6C0', disc: '../assets/bowl-bbq.webp', scene: '../assets/scene-bbq.webp', alt: 'A bowl of Gambit BBQ waffle cut chips',\n        theme: { bg: '#A42D1E', ink: '#FFF3EA', sub: 'rgba(255,243,234,.86)', accent: '#FFC9A8', btnBg: '#FFF3EA', btnInk: '#5A140B', pill: 'rgba(255,243,234,.16)' } },\n      churro: { id: 'churro', num: '03', name: 'Churro', tag: 'Sweet', note: 'Cinnamon & sugar',\n        short: 'Cinnamon sugar, every pocket.',\n        desc: 'The same crisp, with cinnamon sugar filling every waffle pocket. It was the dark horse flavor in our flavor tests, but Churro came out on top, consistently.',\n        bag: '../assets/bag-churro.webp', tint: '#EEDCCB', disc: '../assets/bowl-churro.webp', scene: '../assets/scene-churro.webp', alt: 'A bowl of Gambit Churro waffle cut chips',\n        theme: { bg: '#6A381D', ink: '#FBEEDD', sub: 'rgba(251,238,221,.86)', accent: '#F2B36B', btnBg: '#FBEEDD', btnInk: '#3E1F0D', pill: 'rgba(251,238,221,.16)' } }\n    };\n    return this._d;\n  }\n  setCount(k, v) { const c = Object.assign({}, this.state.counts); const up = v > c[k]; c[k] = Math.max(0, Math.min(36, v)); this.setState(up ? { counts: c, last: k } : { counts: c }); }\n  fillRest() {\n    const c = Object.assign({}, this.state.counts); const ks = this.order;\n    let n = c.salt + c.bbq + c.churro;\n    while (n < 6) { const k = ks.reduce(function (a, b) { return c[b] < c[a] ? b : a; }); c[k] += 1; n += 1; }\n    this.setState({ counts: c });\n  }\n  toggleWant(k) { const w = Object.assign({}, this.state.wants); w[k] = !w[k]; this.setState({ wants: w }); }\n  money(v) { return '$' + (Math.round(v * 100) / 100).toFixed(2).replace(/\\.00$/, ''); }\n  renderVals() {\n    const D = this.data(); const self = this;\n    const soldOut = (this.props.inventory ?? 'Sold out') === 'Sold out';\n    const st = this.state; const fk = st.flavor || 'salt';\n    const counts = st.counts;\n    const n = soldOut ? 0 : counts.salt + counts.bbq + counts.churro;\n    const isCase = n >= 6;\n    const solo = n * 11.25, casePrice = n * 6, price = isCase ? casePrice : solo;\n    let msg;\n    if (soldOut) msg = 'Sold out. Leave your email above and we\u2019ll let you know.';\n    else if (n === 0) msg = 'Pick any 6 for case pricing, or 1\u20135 single bags. Shipping is always free.';\n    else if (!isCase) msg = 'Add ' + (6 - n) + ' more and your total drops to $36' + (solo > 36 ? ' (you save ' + this.money(solo - 36) + ')' : '') + '.';\n    else msg = 'Case pricing unlocked. You\u2019re saving ' + this.money(solo - casePrice) + ' vs. single bags.';\n    const seq = [];\n    this.order.forEach(function (k) { for (let i = 0; i < (soldOut ? 0 : counts[k]); i++) seq.push(k); });\n    const blank = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';\n    const slots = [0, 1, 2, 3, 4, 5].map(function (i) {\n      const k = seq[i];\n      return k ? { img: D[k].bag, op: 1, scale: 1, y: '0px', ring: '0', fill: '0' } : { img: blank, op: 0, scale: .6, y: '-30px', ring: '.18', fill: '.04' };\n    });\n    const starts = ['70vw', '58vw', '46vw'];\n    const flavors = this.order.map(function (k, idx) {\n      const it = D[k]; const active = fk === k; const count = counts[k];\n      return Object.assign({}, it, {\n        count: count,\n        delay: (0.35 + idx * 0.16).toFixed(2) + 's', shadowDelay: (1.15 + idx * 0.16).toFixed(2) + 's', capDelay: (1.3 + idx * 0.14).toFixed(2) + 's',\n        idleDelay: '-' + (idx * 37) + 's', endSpin: (90 + idx * 25) + 's', endDelay: (idx * 0.14).toFixed(2) + 's',\n        fromx: starts[idx], fromr: (420 + idx * 60) + 'deg',\n        thumbRot: (count * 120) + 'deg', bagDelay: (1.6 + idx * 0.16).toFixed(2) + 's',\n        bagTilt: '0deg', bagLift: count % 2 ? '-10px' : '-4px',\n        stageBagY: active ? '0px' : '24px',\n        stageOpacity: active ? 1 : 0,\n        showAdd: !soldOut && count === 0, showStep: !soldOut && count > 0, showSold: soldOut,\n        wantPressed: st.wants[k] ? 'true' : 'false',\n        wantLabel: st.wants[k] ? '\u2713 On your waitlist' : 'Add ' + it.name + ' to my waitlist',\n        wantBg: st.wants[k] ? '#22130B' : 'transparent', wantInk: st.wants[k] ? '#F6F0E6' : '#22130B',\n        chipBg: st.wants[k] ? '#F6F0E6' : 'transparent', chipInk: st.wants[k] ? '#22130B' : '#F6F0E6', chipRing: st.wants[k] ? '#F6F0E6' : 'rgba(246,240,230,.3)', checkOp: st.wants[k] ? 1 : 0,\n        toggleWant: function () { self.toggleWant(k); },\n        wantGo: function () { if (!self.state.wants[k]) self.toggleWant(k); },\n        go: function (e) { if (e && e.preventDefault) e.preventDefault(); self.jump(idx); },\n        add: function () { self.setCount(k, self.state.counts[k] + 1); },\n        sub: function () { self.setCount(k, self.state.counts[k] - 1); }\n      });\n    });\n    const scenes = [];\n    for (let r = 0; r < 2; r++) this.order.forEach(function (k) { scenes.push({ src: D[k].scene, alt: r ? '' : 'Gambit ' + D[k].name + ' chips in a bowl with their bags' }); });\n    const tick = [];\n    for (let r = 0; r < 4; r++) ['Waffle cut', 'Ridiculously crisp', 'Plantain chips'].forEach(function (t) { tick.push(t); });\n    const faqData = [\n      { q: 'Where do you ship?', a: 'Continental U.S. Every order ships free.' },\n      { q: 'Can I mix flavors?', a: 'Mix any flavors in your case, and add extra bags anytime.' },\n      { q: 'Can I buy fewer than 6?', a: 'Not ready for a full case? Grab a bag for $11.25. Hit 6 bags and you get case pricing. Shipping is free either way.' },\n      { q: 'What happens after I order?', a: 'You\u2019ll get a confirmation email shortly after checkout.' },\n      { q: 'What\u2019s in them?', a: '[Your words: ingredients and allergen info for each flavor.]' }\n    ];\n    const faqs = faqData.map(function (x, i) {\n      const open = st.faq === i;\n      return { q: x.q, a: x.a, open: open, expanded: open ? 'true' : 'false', vOp: open ? 0 : 1,\n        toggle: function () { self.setState({ faq: open ? -1 : i }); } };\n    });\n    return {\n      flavors: flavors, slots: slots, faqs: faqs, scenes: scenes, tick: tick, theme: D[fk].theme,\n      setScrolly: this.setScrolly, setSpin: this.setSpin, setEnd: this.setEnd,\n      endClass: st.endIn ? 'roll' : '', endOp: st.endIn ? 1 : 0,\n      caseNote: isCase ? 'case pricing unlocked' : (n > 0 ? (6 - n) + ' to case pricing' : 'case pricing at 6'),\n      progress: (Math.min(n, 6) / 6 * 100) + '%',\n      lines: this.order.filter(function (k) { return counts[k] > 0 && !soldOut; }).map(function (k) { return { bag: D[k].bag, name: D[k].name, count: counts[k], amt: self.money(counts[k] * (isCase ? 6 : 11.25)) }; }),\n      noLines: n === 0,\n      shipLabel: 'Free',\n      boxBg: ({ salt: '#F6EBC8', bbq: '#F1D6C0', churro: '#EEDCCB' })[st.last] || '#EFE6D6',\n      n: n, nCapped: Math.min(n, 6), isCase: isCase, soldOut: soldOut, inStock: !soldOut,\n      priceStr: this.money(price), soloStr: this.money(solo), msg: msg,\n      ctaLabel: soldOut ? 'Sold out' : (n > 0 ? 'Continue to secure payment' : 'Add a bag to start'),\n      ctaBorder: '0',\n
