<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two Plantain Bros</title>
    <meta name="description" content="Two Plantain Bros — coming soon." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf6ef;
        --fg: #1a1a1a;
        --accent: #c4a035;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120f;
          --fg: #f2ebe0;
          --accent: #e8c547;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 2rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.85;
        line-height: 1.5;
      }
      .mark {
        display: inline-block;
        width: 3rem;
        height: 0.25rem;
        background: var(--accent);
        border-radius: 999px;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"></span>
      <h1>Two Plantain Bros</h1>
      <p>Site coming soon.</p>
    </main>
  </body>
</html>
